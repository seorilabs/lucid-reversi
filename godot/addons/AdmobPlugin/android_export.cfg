; AdMob Android export 설정 (godot-admob v6.0).
;
; AndroidExportPlugin(_get_android_manifest_application_element_contents)이 이 파일을 읽어
; AndroidManifest 의 <application> 에
;   <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="..."/>
; 를 주입한다. 씬에 Admob 노드가 없어도 파일 기반으로 동작하므로 헤드리스 CI 에 적합하다.
;
; 이 meta-data 가 없는 채로 play-services-ads 만 링크되면 앱 시작 시 크래시한다.
; 따라서 AndroidExportPlugin 등록과 이 파일은 항상 같이 간다.
;
; 광고 유닛 ID(테스트/실) 분기는 런타임 어댑터(godot/scripts/mobile_ads.gd)에서 처리한다.
; 여기 is_real=true 는 AAB AndroidManifest 에 "실 Android App ID" 를 넣기 위함이다.

[General]

is_real=true

[Debug]

; AdMob 공식 Android 테스트 App ID
app_id="ca-app-pub-3940256099942544~3347511713"

[Release]

; 실 Android App ID (play-store/google-play.config.json 의 ads.androidAppId)
app_id="ca-app-pub-9932778305312246~6509011613"
