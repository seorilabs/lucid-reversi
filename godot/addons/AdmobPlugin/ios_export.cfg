; AdMob iOS export 설정 (godot-admob v6.0).
;
; IosExportPlugin(_export_begin)이 이 파일을 읽어 iOS Info.plist 에
;   GADApplicationIdentifier (is_real ? [Release].app_id : [Debug].app_id)
;   SKAdNetworkItems (AdMob 기본)
; 를 자동 주입한다. 씬에 Admob 노드가 없어도 파일 기반으로 동작하므로 헤드리스 CI 에 적합하다.
;
; [Mediation] 섹션을 두지 않으므로 _export_end 가 Podfile 을 생성하지 않는다
; → CocoaPods 불필요, org App Store 워크플로우의 `xcodebuild archive -project` 경로 그대로 사용.
;
; 광고 유닛 ID(테스트/실) 분기는 런타임 어댑터(godot/scripts/ios_ads.gd)에서 처리한다.
; 여기 is_real=true 는 아카이브 Info.plist 에 "실 iOS App ID" 를 넣기 위함이다.

[General]

is_real=true

[Debug]

; AdMob 공식 iOS 테스트 App ID
app_id="ca-app-pub-3940256099942544~1458002511"

[Release]

; 실 iOS App ID (app-store/app-store.config.json 의 ads.plannedNative.iosAppId)
app_id="ca-app-pub-2444587584524186~1005155551"

[ATT]

; 비맞춤형(non-personalized)·IDFA 미사용 → App Tracking Transparency 프롬프트 미사용.
; att_enabled=false 이면 NSUserTrackingUsageDescription 을 plist 에 넣지 않는다.
att_enabled=false
att_text=""
