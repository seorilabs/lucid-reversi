# Google Play 트랙 승격/상태 변경(재빌드 없이) — org 재사용 워크플로우 호출.
#
# 두 가지로 쓴다.
#   1) 트랙 승격: from_track != to_track (예: internal -> production)
#   2) 같은 트랙 상태 변경: from_track == to_track
#      draft 로 올라가 테스터에게 닿지 않는 build 를 completed 로 되살린다.
#      versionCode 는 재사용할 수 없어 재업로드로는 풀 수 없는 경로다.
name: Promote Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "대상 릴리즈 태그 (예: v2.2.7). 비우면 최신 vX.Y.Z."
        type: string
        required: false
        default: ""
      from_track:
        description: "원본 트랙. to_track 과 같으면 상태만 바꾼다."
        type: string
        required: false
        default: internal
      to_track:
        description: "대상 트랙"
        type: string
        required: false
        default: production
      release_status:
        description: "완전 출시=completed. rollout 지정 시 inProgress 로 전환."
        type: string
        required: false
        default: completed
      rollout:
        description: "단계적 출시 비율(0,1]. 비우면 완전 출시."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      from_track:
        type: string
        required: false
        default: internal
      to_track:
        type: string
        required: false
        default: production
      release_status:
        type: string
        required: false
        default: completed
      rollout:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: lucid-reversi-google-play-promote-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    uses: seorilabs/.github/.github/workflows/promote-google-play.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}
      from_track: ${{ inputs.from_track }}
      to_track: ${{ inputs.to_track }}
      release_status: ${{ inputs.release_status }}
      rollout: ${{ inputs.rollout }}
      # 업로드 직전 identity 검증에 필요하다. 비우면 "Backoffice package_name binding이 없다"로 막힌다.
      package_name: com.etlegame.reversi
