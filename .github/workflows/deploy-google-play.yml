# lucid-reversi Google Play 배포. org 재사용 워크플로우 호출.
name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 실행한 ref를 사용합니다."
        required: false
        default: ""
        type: string
      release_status:
        description: "Google Play track release status"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - completed
      track:
        description: "Google Play track"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - production
      upload:
        description: "Google Play 업로드. false면 AAB 빌드·검증만 합니다."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그"
        required: false
        default: ""
        type: string
      release_status:
        required: false
        default: "draft"
        type: string
      track:
        required: false
        default: "internal"
        type: string
      upload:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/godot-deploy-google-play.yml@main
    secrets:
      FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ inputs.release_tag }}
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}
      # 기본값 false. 업로드는 versionCode를 소비하고 되돌릴 수 없으므로 명시적으로 켠다.
      upload: ${{ inputs.upload == true || inputs.upload == 'true' }}
      project_dir: godot
      scripts_dir: scripts
      # 주입 대상 preset과 export 대상 preset이 같아야 한다. 다르면 중앙 워크플로우가 fail-closed한다.
      android_export_preset: Android
