# lucid-reversi Google Play 배포. org 재사용 워크플로우 호출.
name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 실행한 ref를 사용합니다."
        required: false
        default: ""
        type: string
      upload:
        description: "Google Play internal 업로드(false면 서명 AAB 아티팩트만)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      release_status:
        description: "Google Play track release status"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - completed
      track:
        description: "Google Play track"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - production
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그"
        required: false
        default: ""
        type: string
      upload:
        required: false
        default: true
        type: boolean
      release_status:
        required: false
        default: "draft"
        type: string
      track:
        required: false
        default: "internal"
        type: string
    secrets:
      FIREBASE_ANDROID_API_KEY:
        required: false
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: false
      GODOT_ANALYTICS_CONFIG_JSON_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: true
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: true
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/godot-deploy-google-play.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    secrets:
      FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ inputs.release_tag }}
      package_name: com.etlegame.reversi
      upload: ${{ inputs.upload == 'true' || inputs.upload == true }}
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}
      project_dir: godot
      scripts_dir: scripts
