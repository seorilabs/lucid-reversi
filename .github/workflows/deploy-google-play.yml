# lucid-reversi Google Play 배포. org 재사용 워크플로우 호출.
name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 실행한 ref를 사용합니다."
        required: false
        default: ""
        type: string
      release_status:
        description: "Google Play track release status"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - completed
      track:
        description: "Google Play track"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - production
      version_name:
        description: "Google Play versionName SemVer. 예: 1.0.1"
        required: true
        type: string
      version_code:
        description: "비우면 versionName에서 파생"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그"
        required: false
        default: ""
        type: string
      release_status:
        required: false
        default: "draft"
        type: string
      track:
        required: false
        default: "internal"
        type: string
      version_name:
        required: true
        type: string
      version_code:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/godot-deploy-google-play.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      version_name: ${{ inputs.version_name }}
      version_code: ${{ inputs.version_code }}
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}
      project_dir: godot
      scripts_dir: scripts
      # Android AAB 를 vzyx-cluster 의 x64 셀프호스티드 ARC 러너에서 빌드한다.
      # GitHub-hosted 분량과 Cloud Build 과금을 모두 쓰지 않는다.
      runs_on: seorilabs-x64-android
