# Godot Web export → AIT 래퍼 build → AppsInToss 배포 — ARC.
# org 재사용 워크플로우 호출. export는 build/pages 로 내보내고(래퍼 sync:godot 계약),
# smoke는 리포의 godot quality gate를 사용한다.
name: Deploy Apps in Toss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 실행한 ref를 사용합니다."
        type: string
        required: false
        default: ""
      memo:
        description: "앱인토스 배포 메모 (선택, 최대 1000자)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그"
        type: string
        required: false
        default: ""
      memo:
        description: "앱인토스 배포 메모"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: apps-in-toss-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  ait:
    uses: seorilabs/.github/.github/workflows/godot-deploy-ait.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_GA4_MP_API_SECRET: ${{ secrets.VITE_GA4_MP_API_SECRET }}
      VITE_TOSS_FULLSCREEN_AD_GROUP_ID: ${{ secrets.VITE_TOSS_FULLSCREEN_AD_GROUP_ID }}
      VITE_TOSS_INTERSTITIAL_AD_GROUP_ID: ${{ secrets.VITE_TOSS_INTERSTITIAL_AD_GROUP_ID }}
      VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID: ${{ secrets.VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID }}
      VITE_TOSS_REWARDED_AD_GROUP_ID: ${{ secrets.VITE_TOSS_REWARDED_AD_GROUP_ID }}
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      project_dir: godot
      wrapper_dir: apps/ait
      # 래퍼 sync:godot(prebuild)가 build/pages → public/godot 를 복사하므로 export 출력은 build/pages 여야 한다.
      web_output_dir: build/pages
      smoke_command: |
        bash scripts/godot_quality_gate.sh --project godot --smoke-scene res://tests/test_runner.tscn
