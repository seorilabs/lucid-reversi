# lucid-reversi App Store 배포. org 재사용 워크플로우 호출.
name: Deploy to App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 최신 vX.Y.Z."
        required: false
        default: ""
        type: string
      upload:
        description: "App Store Connect 업로드(false면 xcarchive 아티팩트만)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
      upload:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-store-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/godot-deploy-app-store.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload == 'true' || inputs.upload == true }}
      # Godot iOS export가 생성하는 Xcode scheme은 xcodeproj 파일명(lucidreversi) 기반이다.
      # config/name("루시드 리버시")이 아니라 lucidreversi 여야 xcodebuild -scheme 이 매칭된다.
      ios_scheme: "lucidreversi"
      ios_bundle_id: com.etlegame.reversi
      project_dir: godot
      ensure_godot_script: scripts/ensure_godot.sh
