# lucid-reversi App Store 배포. org 재사용 워크플로우 호출.
#
# 실행 환경: GitHub-hosted macOS(macos-26). 이 저장소는 public이라 표준 러너가
# 무료·무제한이고, Xcode archive·서명·업로드는 macOS에서만 성립한다.
#
# 파일 자체는 삭제하지 않는다: Backoffice의 마켓 타깃 감지가
# `.github/workflows/deploy-app-store.yml` 존재로 "appstore"를 판정한다.
#
# 버전 정본은 릴리즈 태그 하나다. CFBundleVersion은 Xcode Cloud 예외 경로가 아니므로
# 중앙 계약의 derivation.appleBuildNumber(encoded-version)를 쓴다. 같은 태그를 다시
# 올리면 build number가 같아 App Store가 거부하므로 재업로드는 패치 태그로 한다.
name: Deploy to App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 실행한 ref를 사용합니다."
        required: false
        default: ""
        type: string
      upload:
        description: "App Store Connect 업로드. false면 xcarchive artifact만 만듭니다."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그"
        required: false
        default: ""
        type: string
      upload:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-store-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/godot-deploy-app-store.yml@main
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload == true || inputs.upload == 'true' }}
      project_dir: godot
      scripts_dir: scripts
      # 주입 대상 preset과 export 대상 preset이 같아야 한다. 다르면 중앙 워크플로우가 fail-closed한다.
      ios_export_preset: iOS
      # export_presets.cfg의 iOS preset export_path와 같은 파일이어야 한다.
      # 파일명이 xcodebuild scheme 이름을 결정한다.
      xcode_project_path: release-artifacts/ios/xcode/lucidreversi.xcodeproj
      export_options_plist: app-store/exportOptions.plist
      bundle_id: com.etlegame.reversi
      # AdMob xcframework(약 45MB)는 커밋하지 않고 빌드 시 내려받는다.
      prepare_project_script: scripts/install_ios_admob_plugin.sh
