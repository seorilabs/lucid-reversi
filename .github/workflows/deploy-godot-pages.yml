# Godot Web export → GitHub Pages. 웹 채널이라 push→main 자동 배포 유지(마켓 아님).
# org 재사용 워크플로우 호출(export 캐시로 비용 절감).
name: Deploy Godot Web Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    uses: seorilabs/.github/.github/workflows/godot-pages.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
